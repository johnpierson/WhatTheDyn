name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Cancel superseded branch builds, but never interrupt a release in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Compile and verify add-in layout
        run: ./.nuke/build.cmd VerifyAddinLayout

  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PublishGitHub compares the pushed tag against the built version,
          # so the tag has to actually be present in the clone.
          fetch-depth: 0
          fetch-tags: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publish release
        env:
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}
        run: ./.nuke/build.cmd VerifyAddinLayout PublishGitHub
